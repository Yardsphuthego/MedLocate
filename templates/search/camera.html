<div data-scanner data-target="{{ scan_target }}" data-formats="{{ scan_formats }}">
<button type="button" class="button button-light" data-start-camera>Scan with camera</button><button type="button" class="button button-light" data-stop-camera hidden>Stop camera</button>
<video data-camera playsinline muted hidden style="width:100%;max-width:480px"></video><p data-camera-status role="status">Camera access is optional. Images are processed on this device and are not uploaded or saved.</p>
</div>
